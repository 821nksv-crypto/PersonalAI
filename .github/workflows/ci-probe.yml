name: CI Probe
on:
  push:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect local engine
        run: |
          mkdir -p /tmp/src
          unzip -q ./*.zip -d /tmp/src
          find /tmp/src -name ExecuTorchLocalEngine.kt -print -exec sed -n '1,260p' {} \;
