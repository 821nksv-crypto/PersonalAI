       ) {\n                            Text(\"PersonalAI\", style = MaterialTheme.typography.titleLarge)\n                            Spacer(Modifier.weight(1f))\n                            Text(\"Offline\", color = Color(0xFF16A34A))\n                        }\n                    }\n\n                    LazyColumn(\n                        modifier = Modifier.weight(1f).fillMaxWidth().padding(12.dp),\n                        verticalArrangement = Arrangement.spacedBy(10.dp),\n                        reverseLayout = false\n                    ) {\n                        if (messages.isEmpty()) {\n                            item {\n                                Text(\n                                    \"Ask a question. PersonalAI will answer using the local model on this device.\",\n                                    color = Color(0xFF667085),\n                                    modifier = Modifier.padding(12.dp)\n                                )\n                            }\n                        }\n                        items(messages) { (user, text) ->\n                            Row(\n                                Modifier.fillMaxWidth(),\n                                horizontalArrangement = if (user) Arrangement.End else Arrangement.Start\n                            ) {\n                                Surface(\n                                    shape = RoundedCornerShape(16.dp),\n                                    color = if (user) Color(0xFFE8F0FE) else Color.White,\n                                    tonalElevation = 1.dp\n                                ) {\n                                    Text(text, Modifier.padding(12.dp))\n                                }\n                            }\n                        }\n                        if (loading) {\n                            item { Text(\"Thinking…\", color = Color(0xFF667085), modifier = Modifier.padding(12.dp)) }\n                        }\n                    }\n\n                    Surface(color = Color.White, shadowElevation = 4.dp) {\n                        Row(\n                            Modifier.fillMaxWidth().padding(10.dp),\n                            verticalAlignment = Alignment.Bottom\n                        ) {\n                            OutlinedTextField(\n                                value = input,\n                                onValueChange = { input = it },\n                                modifier = Modifier.weight(1f),\n                                placeholder = { Text(\"Ask anything…\") },\n                                enabled = !loading,\n                                maxLines = 5\n                            )\n                            Spacer(Modifier.width(8.dp))\n                            Button(\n                                enabled = input.isNotBlank() && !loading,\n                                onClick = {\n                                    val question = input.trim()\n                                    input = \"\"\n                                    messages.add(true to question)\n                                    loading = true\n                                    scope.launch {\n                                        val answer = withContext(Dispatchers.Default) {\n                                            runCatching { answerWithLocalModel(question) }\n                                                .getOrElse { \"Local AI error: ${it.message ?: it.javaClass.simpleName}\" }\n                                        }\n                                        messages.add(false to answer)\n                                        loading = false\n                                    }\n                                }\n                            ) { Text(\"Send\") }\n                        }\n                    }\n                }\n            }\n        }\n    }\n\n    private suspend fun answerWithLocalModel(question: String): String {\n        val model = findFile(listOf(\"SmolLM2-135M-vulkan-8da4w-2k.pte\"))\n            ?: copyBundledAsset(\"models/SmolLM2-135M-vulkan-8da4w-2k.pte\", \"SmolLM2-135M-vulkan-8da4w-2k.pte\")\n        val tokenizer = findFile(listOf(\"tokenizer.json\"))\n            ?: copyBundledAsset(\"models/tokenizer.json\", \"tokenizer.json\")\n        return ExecuTorchLocalEngine(model, tokenizer).generate(question)\n    }\n\n    private fun copyBundledAsset(assetPath: String, fileName: String): File {\n        val dir = File(filesDir, \"models\").apply { mkdirs() }\n        val target = File(dir, fileName)\n        if (!target.exists() || target.length() == 0L) {\n            assets.open(assetPath).use { input ->\n                target.outputStream().use { output ->\n                    val buffer = ByteArray(1024 * 1024)\n                    while (true) {\n                        val n = input.read(buffer)\n                        if (n < 0) break\n                        output.write(buffer, 0, n)\n                    }\n                    output.fd.sync()\n                }\n            }\n        }\n        return target\n    }\n\n    private fun findFile(names: List<String>): File? {\n        val roots = listOf(File(filesDir, \"models\"), File(filesDir, \"models/incoming\"))\n        for (root in roots) {\n            if (!root.exists()) continue\n            root.walkTopDown().firstOrNull { it.isFile && it.name in names }?.let { return it }\n        }\n        return null\n    }\n}\n")
