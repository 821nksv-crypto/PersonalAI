          """)
          
          manifest = file("AndroidManifest.xml")
          ms = manifest.read_text()
          import re
          ms = re.sub(r'android:icon="@[^"]+"', 'android:icon="@drawable/personalai_logo"', ms, count=1)
          manifest.write_text(ms)

          replace("PersonalAiHostActivity.kt",
                  "import com.personalai.mvp.models.SelectedModelPair",
                  """import com.personalai.mvp.models.SelectedModelPair
          import com.personalai.mvp.models.ModelDownloader
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.launch""")
          replace("PersonalAiHostActivity.kt",
                  "private val modelImportService by lazy { ModelImportService(this) }",
                  """private val modelImportService by lazy { ModelImportService(this) }
              private val modelDownloader by lazy { ModelDownloader(this, modelImportService) }""")
          replace("PersonalAiHostActivity.kt",
                  "var requiresReindex by remember { mutableStateOf(coordinator.documents.requiresReindex()) }",
                  """var requiresReindex by remember { mutableStateOf(coordinator.documents.requiresReindex()) }
              var downloadingModel by remember { mutableStateOf(false) }
              var downloadProgress by remember { mutableStateOf(0f) }
              var downloadStatus by remember { mutableStateOf("") }""")
          replace("PersonalAiHostActivity.kt",
                  "                    onImportModel = {",
                  """                    onDownloadModel = {
                        if (downloadingModel) return@PersonalAiAppShell
                        lifecycleScope.launch {
                            downloadingModel = true
                            downloadProgress = 0f
                            downloadStatus = "Preparing model download…"
                            try {
                                val message = modelDownloader.downloadAndInstall { downloaded, total ->
                                    runOnUiThread {
                                        downloadProgress = if (total > 0L) downloaded.toFloat() / total.toFloat() else 0f
                                        downloadStatus = if (total > 0L) {
                                            "Downloading ${(downloadProgress * 100).toInt()}%"
                                        } else {
                                            "Downloading ${downloaded / (1024 * 1024)} MB"
                                        }
                                    }
                                }
                                downloadStatus = message
                                installedModels = coordinator.models.installed()
                            } catch (t: Throwable) {
                                downloadStatus = "Download failed: ${t.message ?: t.javaClass.simpleName}"
                            } finally {
                                downloadingModel = false
                            }
                        }
                    },
                    onImportModel = {""")
          replace("PersonalAiHostActivity.kt",
                  "                    onRemoveModel = coordinator.models::remove,",
                  """                    onRemoveModel = coordinator.models::remove,
                    downloadingModel = downloadingModel,
                    downloadProgress = downloadProgress,
                    downloadStatus = downloadStatus,""")
          

          print("Source compatibility patches applied.")
          
          PY
          P=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          mkdir -p "$P/app/src/main/java/com/personalai/mvp/settings"
          cp "$GITHUB_WORKSPACE/patches/SettingsScreen.kt" "$P/app/src/main/java/com/personalai/mvp/settings/SettingsScreen.kt"
          mkdir -p "$P/app/src/main/java/com/personalai/mvp/models"
          cp "$GITHUB_WORKSPACE/patches/ModelDownloader.kt" "$P/app/src/main/java/com/personalai/mvp/models/ModelDownloader.kt"
          mkdir -p "$P/app/src/main/java/com/personalai/mvp/importer"
          cp "$GITHUB_WORKSPACE/patches/ModelImportScreen.kt" "$P/app/src/main/java/com/personalai/mvp/importer/ModelImportScreen.kt"
          MANIFEST="$P/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              marker = '<application'
              if marker not in s:
                  raise SystemExit(f"Could not find <application> in {p}")
              s = s.replace(marker, permission + "\\n    " + marker, 1)
              p.write_text(s)
          print("Ensured INTERNET permission in", p)
          PY
          rm -rf "$P/app/src/main/assets/models"
          mkdir -p "$P/app/src/main/assets/models"
          echo "No model bundled: Qwen3 0.6B downloads on demand from the Models screen."
          echo "PROJ=$P" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        continue-on-error: true
        working-directory: ${{ env.PROJ }}
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: personalai-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
