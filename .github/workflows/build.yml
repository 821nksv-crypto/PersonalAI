          ) {
              // Do not prepare the 1.2+ GB model automatically during app startup.
              // The user can start model preparation from this screen after the UI is responsive.
              Column(
                  Modifier.fillMaxSize().padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text("Local Models", style = MaterialTheme.typography.headlineSmall)
                  Text(
