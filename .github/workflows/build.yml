name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and patch project sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          unzip -q ./*.zip -d src
          python3 <<'PY'
          import re
          from pathlib import Path
          
          root = next(p.parent for p in Path("src").rglob("settings.gradle.kts"))

          def file(name):
              matches = list(root.rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {name}, found {len(matches)}")
              return matches[0]
          
          def write(name, text):
              file(name).write_text(text)
          
          def write_new(relative, text):
              p = root / relative
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text)
          
          logo_xml = "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"108dp\" android:height=\"108dp\" android:viewportWidth=\"108\" android:viewportHeight=\"108\">\n<path android:fillColor=\"#05080D\" android:pathData=\"M0,18C0,8.1 8.1,0 18,0h72c9.9,0 18,8.1 18,18v72c0,9.9 -8.1,18 -18,18H18C8.1,108 0,99.9 0,90z\"/>\n<path android:fillColor=\"#00D8FF\" android:pathData=\"M54,25C43,16 28,22 28,36c0,5 2,9 5,12 -8,5 -10,17 -4,24 4,5 10,7 16,5 3,7 10,10 17,8V29c-3,-1 -5,-2 -8,-4z\"/>\n<path android:fillColor=\"#7B4DFF\" android:pathData=\"M54,25C65,16 80,22 80,36c0,5 -2,9 -5,12 8,5 10,17 4,24 -4,5 -10,7 -16,5 -3,7 -10,10 -17,8V29c3,-1 5,-2 8,-4z\"/>\n<path android:fillColor=\"#07101C\" android:pathData=\"M52,29h4v50h-4z\"/>\n<path android:fillColor=\"#FFFFFF\" android:pathData=\"M40,35c-4,0 -7,3 -7,7s3,7 7,7 7,-3 7,-7 -3,-7 -7,-7zM68,35c-4,0 -7,3 -7,7s3,7 7,7 7,-3 7,-7 -3,-7 -7,-7z\"/>\n<path android:fillColor=\"#28DFFF\" android:pathData=\"M39,41h12v3H39zM57,41h12v3H57zM40,56h10v3H40zM58,56h10v3H58zM42,69h9v3H42zM57,69h9v3H57z\"/>\n<path android:fillColor=\"#00000000\" android:strokeColor=\"#35B9FF\" android:strokeWidth=\"1.2\" android:pathData=\"M17,54a37,37 0,1 0,74 0a37,37 0,1 0,-74 0\"/>\n<path android:fillColor=\"#00000000\" android:strokeColor=\"#A34FFF\" android:strokeWidth=\"1.2\" android:pathData=\"M28,28a37,37 0,0 1,52 52\"/>\n</vector>"
          write_new("app/src/main/res/drawable/personalai_logo.xml", logo_xml)

          # Large bundled Qwen .pte asset: keep it uncompressed and give Gradle enough heap.
          gp = file("gradle.properties")
          gpt = gp.read_text() if gp.exists() else ""
          gpt = re.sub(r"(?m)^org\\.gradle\\.jvmargs=.*$", "org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8", gpt)
          if "org.gradle.jvmargs=" not in gpt:
              gpt += "\\norg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\\n"
          gp.write_text(gpt)

          gradle_files = [p for p in root.rglob("build.gradle") if p.parent.name == "app"]
          gradle_kts_files = [p for p in root.rglob("build.gradle.kts") if p.parent.name == "app"]
          candidates = gradle_files or gradle_kts_files
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one app build script, found {len(candidates)}")
          bf = candidates[0]
          bt = bf.read_text()
          if "noCompress += \"pte\"" not in bt:
              bt = bt.replace("android {", "android {\n    androidResources {\n        noCompress += \"pte\"\n    }", 1)
              bf.write_text(bt)

          def replace(name, old, new, count=1):
              p = file(name)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Patch anchor not found in {p}: {old[:120]!r}")
              p.write_text(s.replace(old, new, count))
          
          for p in root.rglob("*"):
              if p.is_file() and p.suffix in {".gradle", ".kts", ".toml"}:
                  s = p.read_text()
                  ns = s.replace("org.pytorch:executorch-android:1.5.0",
                                 "org.pytorch:executorch-android:1.4.0")
                  if ns != s:
                      p.write_text(ns)
          
          write("DocumentImportCoordinator.kt", """package com.personalai.mvp.documents
          
          import android.content.Context
          import java.io.File
          import java.io.FileInputStream
          import java.security.MessageDigest
          import java.util.UUID
          
          class DocumentImportCoordinator(private val context: Context) {
              private val controller = DocumentLibraryController(context)
          
              fun importPdf(source: File, displayName: String): ImportedDocument {
                  val id = UUID.randomUUID().toString()
                  val safeName = displayName.replace(Regex("[^A-Za-z0-9._-]"), "_")
                  val target = File(context.filesDir, "documents/$id-$safeName")
                  target.parentFile?.mkdirs()
                  FileInputStream(source).use { input ->
                      target.outputStream().use { output ->
                          input.copyTo(output, 1024 * 1024)
                          output.fd.sync()
                      }
                  }
                  controller.registerImported(id, displayName, target.absolutePath)
                  return ImportedDocument(id, displayName, target.absolutePath, target.length(), sha256(target))
              }
          
              private fun sha256(file: File): String =
                  MessageDigest.getInstance("SHA-256").digest(file.readBytes())
                      .joinToString("") { "%02x".format(it) }
          }
          """)
          
          write("DocumentProgressBridge.kt", """package com.personalai.mvp.documents
          
          import androidx.lifecycle.LifecycleOwner
          import com.personalai.mvp.indexing.ObservedWorkState
          import com.personalai.mvp.indexing.WorkManagerIndexingObserver
          
          class DocumentProgressBridge(private val observer: WorkManagerIndexingObserver) {
              fun observe(owner: LifecycleOwner, documentId: String, onUpdate: (ObservedWorkState) -> Unit) {
                  observer.observe(documentId).observe(owner) { infos ->
                      observer.update(documentId, infos ?: emptyList())
                      observer.state.value.lastOrNull()?.let(onUpdate)
                  }
              }
          
              fun cancel(documentId: String) = observer.cancel(documentId)
          }
          """)
          
          replace("RagOrchestrator.kt",
                  "private val index: LocalVectorIndex",
                  "private val index: PersistentVectorIndex")
          
          replace("ExecuTorchLocalEngine.kt",
          """            val m = LlmModule(config)
                      val status = m.load()
                      if (status == 0) module = m else loadError = "ExecuTorch load error: $status"
          """,
          """            val m = LlmModule(config)
                      m.load()
                      module = m
          """)
          
          write("DocumentChunk.kt", """package com.personalai.mvp.rag
          
          data class DocumentChunk(
              val documentName: String,
              val pageNumber: Int,
              val chunkIndex: Int,
              val text: String
          )
          """)
          replace("LocalDocumentStore.kt",
                  "DocumentChunk(name, i, part)",
                  "DocumentChunk(name, 0, i, part)")
          
          replace("DocumentIndexWorker.kt",
          """                progressReporter.running(documentId, processed, total)
                          setProgress(Data.Builder()
                              .putString(KEY_STATUS, "RUNNING")
                              .putInt(KEY_PROGRESS, ((processed.toDouble() / total.coerceAtLeast(1) * 100.0)).toInt())
                              .putInt("processedPages", processed)
                              .putInt("totalPages", total)
                              .putString("documentId", documentId)
                              .build())
          """,
          """                progressReporter.running(documentId, processed, total)
          """)
          
          replace("IndexingController.kt",
                  "import androidx.lifecycle.LiveData",
                  "import androidx.lifecycle.LiveData\nimport androidx.lifecycle.map")
          
          replace("OnnxMiniLmEmbedder.kt",
                  "        OnnxTensor.createTensor(env, LongBuffer.wrap(inputIds), longArrayOf(1, maxLength)).use { tIds ->",
                  "        return OnnxTensor.createTensor(env, LongBuffer.wrap(inputIds), longArrayOf(1L, maxLength.toLong())).use { tIds ->")
          replace("OnnxMiniLmEmbedder.kt",
                  "longArrayOf(1, maxLength)",
                  "longArrayOf(1L, maxLength.toLong())",
                  count=2)
          
          replace("ModelInstallVerifier.kt",
                  "data class VerificationResult(val ok: Boolean, val reason: String)\n\n",
                  "")
          

          
          print("EXECUTORCH SOURCE BEGIN")
          ep = file("ExecuTorchLocalEngine.kt")
          print(ep.read_text())
          print("EXECUTORCH SOURCE END")

          replace("ExecuTorchLocalEngine.kt",
                  "m.generate(prompt, config, callback)",
                  "m.generate(applySystemInstructions(prompt), config, callback)",
                  count=2)


          replace("ExecuTorchLocalEngine.kt",
                  "    fun stopStreaming() {",
                  """    private fun applySystemInstructions(prompt: String): String {
          if (prompt.contains("<|im_start|>system")) return prompt
          var dir = modelFile.parentFile
          repeat(8) {
              val candidate = dir?.resolve("personalai_ai_instructions.txt")
              if (candidate?.isFile == true) {
                  val instruction = candidate.readText().trim()
                  if (instruction.isNotBlank()) {
                      return "<|im_start|>system\\n" + instruction +
                          "<|im_end|>\\n" + prompt
                  }
              }
              dir = dir?.parentFile
          }
          return prompt
          }

          fun stopStreaming() {""")

          write_new("app/src/main/java/com/personalai/mvp/models/ModelDownloader.kt", """package com.personalai.mvp.models

          import android.content.Context
          import com.personalai.mvp.importer.ImportResult
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.security.MessageDigest
          import java.util.UUID
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject

          class ModelDownloader(
              private val context: Context,
              private val importService: ModelImportService
          ) {
              companion object {
                  private const val MODEL_FILE = "Qwen3-1.7B-8da4w-gptq-2k.pte"
                  private const val TOKENIZER_FILE = "tokenizer.json"
                  private const val MODEL_ID = "qwen3-1.7b-xnnpack-8da4w-2k"
                  private const val MODEL_VERSION = "1.0"
              }

              suspend fun downloadAndInstall(
                  onProgress: (downloaded: Long, total: Long) -> Unit = { _, _ -> }
              ): String = withContext(Dispatchers.IO) {
                  val modelsDir = File(context.filesDir, "models/incoming").apply { mkdirs() }
                  val model = File(modelsDir, MODEL_FILE)
                  val tokenizer = File(modelsDir, TOKENIZER_FILE)

                  if (!model.exists() || model.length() == 0L) {
                      copyBundledAsset("models/$MODEL_FILE", model, onProgress)
                  }
                  if (!tokenizer.exists() || tokenizer.length() == 0L) {
                      copyBundledAsset("models/$TOKENIZER_FILE", tokenizer) { done, total ->
                          onProgress(done, total)
                      }
                  }

                  require(model.isFile && model.length() > 0) { "Bundled model is missing or empty." }
                  require(tokenizer.isFile && tokenizer.length() > 0) { "Bundled tokenizer is missing or empty." }

                  val manifest = JSONObject()
                      .put("id", MODEL_ID)
                      .put("displayName", "Qwen3 1.7B • XNNPACK 2K")
                      .put("version", MODEL_VERSION)
                      .put("runtime", "executorch")
                      .put("architecture", "arm64-v8a")
                      .put("fileName", MODEL_FILE)
                      .put("sizeBytes", model.length())
                      .put("sha256", sha256Streaming(model))
                      .put("tokenizerFileName", TOKENIZER_FILE)
                      .put("tokenizerSha256", sha256Streaming(tokenizer))

                  val manifestFile = File(modelsDir, "qwen3-1.7b-manifest.json")
                  manifestFile.writeText(manifest.toString())

                  val pair = SelectedModelPair(UUID.randomUUID().toString(), model, manifestFile, tokenizer)
                  when (val result = importService.verifyAndInstall(pair)) {
                      is ImportResult.Success -> result.message
                      is ImportResult.Failure -> throw IllegalStateException(result.message)
                      is ImportResult.Cancelled -> throw IllegalStateException("Model installation cancelled.")
                  }
              }

              private fun copyBundledAsset(
                  assetPath: String,
                  destination: File,
                  onProgress: (Long, Long) -> Unit = { _, _ -> }
              ) {
                  destination.parentFile?.mkdirs()
                  context.assets.open(assetPath).use { input ->
                      FileOutputStream(destination).use { output ->
                          val buffer = ByteArray(1024 * 1024)
                          var copied = 0L
                          val total = try { input.available().toLong() } catch (_: Throwable) { -1L }
                          while (true) {
                              val n = input.read(buffer)
                              if (n < 0) break
                              output.write(buffer, 0, n)
                              copied += n
                              onProgress(copied, total)
                          }
                          output.fd.sync()
                      }
                  }
              }

              private fun sha256Streaming(file: File): String {
                  val digest = MessageDigest.getInstance("SHA-256")
                  FileInputStream(file).use { input ->
                      val buffer = ByteArray(1024 * 1024)
                      while (true) {
                          val n = input.read(buffer)
                          if (n < 0) break
                          digest.update(buffer, 0, n)
                      }
                  }
                  return digest.digest().joinToString("") { "%02x".format(it) }
              }
          }
          """)
          replace("ModelImportScreen.kt",
                  "package com.personalai.mvp.importer",
                  """package com.personalai.mvp.importer""",
                  count=0)
          
