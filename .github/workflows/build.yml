      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        working-directory: ${{ env.PROJ }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Source validation
        working-directory: ${{ env.PROJ }}
        run: |
          ! grep -R "PrivacySetupScreen" app/src/main/java || (echo "Privacy onboarding still present" && exit 1)
          ! grep -R "General Clauses Act 5(3)" app/src/main/java || (echo "Fake recent chat seed still present" && exit 1)
          test ! -s app/src/main/assets/models/Qwen3-1.7B-8da4w-gptq-2k.pte
          echo "UI/privacy/storage source checks passed."
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: personalai-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
