          PY
          P=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          MANIFEST="$P/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              marker = '<application'
              if marker not in s:
                  raise SystemExit(f"Could not find <application> in {p}")
              s = s.replace(marker, permission + "\\n    " + marker, 1)
